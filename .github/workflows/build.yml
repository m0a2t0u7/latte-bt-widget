name: Build APK
on: { push: { branches: [main] }, workflow_dispatch: {} }
permissions:
  contents: write
env:
  APP_NAME: latte-bt-widget
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - run: gradle :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
      - name: Verify APK and previous signing certificate
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "$APP_NAME.apk"
          curl -fsSL https://github.com/m0a2t0u7/latte-bt-widget/releases/download/latest/latte-bt-widget.apk -o previous.apk
          echo '60b30c8bec3f1539fbe9e5f36677e6e6b343dfb6dba0197763052bb7a1da042f  previous.apk' | sha256sum -c
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --print-certs previous.apk > previous-cert.txt
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APP_NAME.apk" > apk-cert.txt
          diff <(grep 'certificate SHA-256 digest' previous-cert.txt) <(grep 'certificate SHA-256 digest' apk-cert.txt)
          "$BUILD_TOOLS/aapt" dump badging "$APP_NAME.apk" > apk-metadata.txt
          grep "package: name='com.shinyalatte.btwidget' versionCode='2' versionName='1.1'" apk-metadata.txt
          sha256sum "$APP_NAME.apk" > apk-sha256.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Render and verify themes and widgets
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -g app/build/outputs/apk/debug/app-debug.apk
            adb install -g app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w com.shinyalatte.btwidget.test/android.test.InstrumentationTestRunner | tee instrumentation.txt
            grep -q 'OK (1 test)' instrumentation.txt
            mkdir -p appearance-qa
            adb exec-out run-as com.shinyalatte.btwidget tar -C files -cf - appearance-qa > appearance-qa.tar
            tar -xf appearance-qa.tar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bluetooth-widget-1.1-verification
          path: |
            latte-bt-widget.apk
            apk-*.txt
            instrumentation.txt
            appearance-qa/
            app/build/reports/lint-results-debug.html
      # Versioned releases preserve every previously delivered APK.
      - name: Publish versioned release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          TAG="v1.1-${GITHUB_SHA::7}"
          gh release create "$TAG" "$APP_NAME.apk" apk-cert.txt apk-metadata.txt apk-sha256.txt --target "$GITHUB_SHA" --title "Bluetoothウィジェット｜ラテ 1.1" --notes "ライト・ダーク・端末連動、採用アイコン②。旧APKを維持。" --latest
      # The deployed legacy GAS deletes older files. Keep this step gated until its safe replacement is deployed.
      # Current delivery uses the connected Drive upload tool and metadata readback.
      - name: Upload to Google Drive
        if: ${{ vars.GAS_PRESERVES_OLD_APKS == 'true' }}
        env:
          GAS_URL: ${{ secrets.GAS_URL }}
          GAS_KEY: ${{ secrets.GAS_KEY }}
        run: |
          if [ -z "$GAS_URL" ] || [ -z "$GAS_KEY" ]; then echo "Drive credentials unavailable"; exit 1; fi
          base64 -w0 "$APP_NAME.apk" > apk.b64
          curl -sSL --fail -X POST -H "Content-Type: text/plain" --data-binary @apk.b64 \
            "$GAS_URL?key=$GAS_KEY&app=$APP_NAME&ver=1.1-${GITHUB_SHA::7}" > result.json
          python3 -c 'import json; r=json.load(open("result.json")); assert r.get("ok") and r.get("trashed",0)==0; print("Drive upload verified")'
