name: Build APK
on: { push: { branches: [main] }, workflow_dispatch: {} }
permissions:
  contents: write
env:
  APP_NAME: latte-bt-widget
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - run: gradle :app:assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk "$APP_NAME.apk"

      # 1. 固定URLで最新版を配布（古いReleaseは削除して作り直す）
      - name: Publish latest release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest "$APP_NAME.apk" --title "最新版 (${GITHUB_SHA::7})" --notes "自動ビルド ${GITHUB_SHA::7}" --latest

      # 2. Google Driveへ保存（古いAPKはGAS側でゴミ箱へ）
      - name: Upload to Google Drive
        env:
          GAS_URL: ${{ secrets.GAS_URL }}
          GAS_KEY: ${{ secrets.GAS_KEY }}
        run: |
          if [ -z "$GAS_URL" ] || [ -z "$GAS_KEY" ]; then echo "GAS_URL/GAS_KEY 未設定のためDrive保存をスキップ"; exit 0; fi
          base64 -w0 "$APP_NAME.apk" > apk.b64
          curl -sSL --fail -X POST -H "Content-Type: text/plain" --data-binary @apk.b64 \
            "$GAS_URL?key=$GAS_KEY&app=$APP_NAME&ver=${GITHUB_SHA::7}" | tee result.json
          grep -q '"ok":true' result.json
